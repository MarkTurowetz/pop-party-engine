<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controller Spawner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <h1>Controller Spawner</h1>
      <p id="appOrigin">Detecting app...</p>
    </header>

    <label class="field">
      Stage Code
      <input id="stageCodeInput" maxlength="6" placeholder="ABCD" autocomplete="off">
    </label>

    <label class="field">
      Controllers
      <input id="controllerCountInput" type="number" min="1" max="50" value="4">
    </label>

    <details class="names" open>
      <summary>Player Names</summary>
      <textarea id="playerNamesInput" spellcheck="false"></textarea>
    </details>

    <div class="actions">
      <button id="spawnButton" type="button">Spawn Controllers</button>
      <button id="sortControllersButton" type="button">Sort Controllers</button>
      <button id="tapRandomButton" type="button">Tap Random Option</button>
      <button id="closeControllersButton" type="button">Close All Controllers</button>
    </div>

    <p class="status" id="statusText">Open this extension from your Party Game Template stage or controller page.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
