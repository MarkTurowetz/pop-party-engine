<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flip 7 Party</title>
  <style>
    :root {
      --ink: #17131f;
      --paper: #fffdf4;
      --cream: #fff6d8;
      --pink: #ff4fa3;
      --orange: #ff9e2c;
      --yellow: #ffe156;
      --cyan: #22d3ee;
      --green: #60d394;
      --purple: #7c3aed;
      --blue: #2458ff;
      --shadow: 10px 10px 0 rgba(23, 19, 31, 0.45);
      font-family: ui-rounded, "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 225, 86, 0.95) 0 8rem, transparent 8.2rem),
        radial-gradient(circle at 86% 20%, rgba(34, 211, 238, 0.78) 0 8rem, transparent 8.2rem),
        radial-gradient(circle at 72% 86%, rgba(255, 79, 163, 0.68) 0 10rem, transparent 10.2rem),
        linear-gradient(135deg, #24115f 0%, #5b1bbd 46%, #ff4fa3 100%);
      overflow-x: hidden;
    }

    html.controller-locked,
    body.controller-locked {
      width: 100%;
      height: var(--app-height, 100vh);
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    html.controller-locked :not(input):not(textarea):not(select) {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 24px;
      padding: clamp(22px, 4vw, 48px);
      color: #fff;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      opacity: 0.24;
      filter: blur(2px);
    }

    .stage::before {
      width: 42vmax;
      height: 42vmax;
      left: -18vmax;
      bottom: -20vmax;
      background: repeating-conic-gradient(from 9deg, #fff 0 10deg, transparent 10deg 22deg);
      animation: spin 44s linear infinite;
    }

    .stage::after {
      width: 38vmax;
      height: 38vmax;
      right: -18vmax;
      top: -19vmax;
      background: repeating-conic-gradient(from 0deg, #fff 0 8deg, transparent 8deg 18deg);
      animation: spin 36s linear reverse infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .stage-main {
      align-self: start;
      display: grid;
      justify-items: center;
      gap: clamp(18px, 4vw, 34px);
      text-align: center;
      padding-top: clamp(10px, 5vh, 58px);
    }

    .stage-title {
      margin: 0;
      color: #fff;
      font-size: clamp(58px, 10vw, 132px);
      line-height: 0.86;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 7px 7px 0 #000;
    }

    .stage-code-panel {
      display: grid;
      gap: 8px;
      padding: 18px clamp(22px, 5vw, 46px);
      border: 5px solid var(--ink);
      border-radius: 24px;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: var(--shadow);
      transform: rotate(-1deg);
    }

    .stage-code-label {
      font-size: clamp(14px, 2vw, 22px);
      font-weight: 1000;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stage-code {
      font-size: clamp(54px, 10vw, 112px);
      line-height: 0.9;
      font-weight: 1000;
      letter-spacing: 0.06em;
    }

    .stage-status {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 4px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 6px 6px 0 rgba(23, 19, 31, 0.45);
      font-size: clamp(18px, 2.8vw, 30px);
      font-weight: 1000;
    }

    .start-popup {
      position: absolute;
      top: clamp(24px, 5vh, 52px);
      left: 50%;
      z-index: 5;
      transform: translateX(-50%);
      min-width: min(520px, calc(100vw - 36px));
      padding: 20px 26px;
      border: 5px solid var(--ink);
      border-radius: 24px;
      color: var(--ink);
      background: var(--green);
      box-shadow: var(--shadow);
      text-align: center;
      font-size: clamp(28px, 5vw, 54px);
      line-height: 0.95;
      font-weight: 1000;
      animation: popIn 240ms cubic-bezier(0.19, 1, 0.22, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateX(-50%) scale(0.7) rotate(-2deg); }
      to { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
    }

    .stage-footer {
      align-self: end;
      display: grid;
      gap: 18px;
    }

    .join-prompt {
      justify-self: center;
      padding: 12px 18px;
      border: 4px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: var(--cream);
      box-shadow: 6px 6px 0 rgba(23, 19, 31, 0.45);
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 1000;
    }

    .player-lobby {
      min-height: 116px;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: clamp(10px, 2vw, 18px);
      flex-wrap: wrap;
      padding: 4px;
    }

    .player-tile {
      width: clamp(94px, 11vw, 138px);
      display: grid;
      justify-items: center;
      gap: 8px;
      color: #fff;
    }

    .player-avatar {
      width: clamp(58px, 7vw, 86px);
      height: clamp(58px, 7vw, 86px);
      display: grid;
      place-items: center;
      border: 5px solid var(--ink);
      box-shadow: 6px 6px 0 rgba(23, 19, 31, 0.52);
      background: var(--avatar-color);
      color: #fff;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 1000;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
    }

    .shape-circle { border-radius: 50%; }
    .shape-square { border-radius: 16px; }
    .shape-diamond { border-radius: 18px; transform: rotate(45deg); }
    .shape-diamond span { transform: rotate(-45deg); }
    .shape-pill { border-radius: 999px; width: clamp(76px, 9vw, 112px); }
    .shape-triangle {
      width: 0;
      height: 0;
      border-left: clamp(34px, 4vw, 48px) solid transparent;
      border-right: clamp(34px, 4vw, 48px) solid transparent;
      border-bottom: clamp(64px, 7vw, 92px) solid var(--avatar-color);
      background: transparent;
      box-shadow: none;
      border-top: 0;
    }
    .shape-triangle span {
      position: absolute;
      margin-top: clamp(24px, 2.8vw, 36px);
      margin-left: -12px;
    }
    .shape-hex {
      border-radius: 24px 10px;
      transform: skew(-8deg);
    }
    .shape-hex span { transform: skew(8deg); }

    .player-name {
      max-width: 100%;
      padding: 7px 10px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 4px 4px 0 rgba(23, 19, 31, 0.42);
      font-size: clamp(12px, 1.6vw, 17px);
      line-height: 1;
      font-weight: 1000;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .vip-badge {
      margin-top: -4px;
      padding: 4px 8px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: var(--yellow);
      font-size: 11px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .controller {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--app-height, 100vh);
      height: var(--app-height, 100dvh);
      min-height: var(--app-height, 100vh);
      display: grid;
      place-items: center;
      padding: clamp(10px, 2.2vmin, 20px);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.14) 0 2px, transparent 2px 58px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.14) 0 2px, transparent 2px 58px),
        linear-gradient(135deg, #22d3ee 0%, #60d394 52%, #ffe156 100%);
      background-size: 58px 58px, 58px 58px, auto;
    }

    .controller-panel {
      width: min(560px, 100%);
      display: grid;
      gap: clamp(12px, 2.4vmin, 20px);
      max-height: calc(100dvh - 20px);
      overflow: hidden;
      padding: clamp(14px, 4vmin, 34px);
      border: 5px solid var(--ink);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 16px 16px 0 var(--ink);
    }

    .controller-panel h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 74px);
      line-height: 0.86;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .join-form {
      display: grid;
      gap: 14px;
    }

    .field-label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 1000;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .text-input {
      width: 100%;
      height: 60px;
      border: 5px solid var(--ink);
      border-radius: 16px;
      outline: none;
      padding: 0 16px;
      color: var(--ink);
      background: #fff;
      box-shadow: inset 5px 5px 0 rgba(23, 19, 31, 0.08);
      font-size: 24px;
      font-weight: 1000;
    }

    .text-input:focus {
      box-shadow: inset 5px 5px 0 rgba(23, 19, 31, 0.08), 0 0 0 5px rgba(36, 88, 255, 0.22);
    }

    .stage-code-input {
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .primary-button {
      min-height: clamp(48px, 9vh, 58px);
      border: 5px solid var(--ink);
      border-radius: 999px;
      color: #fff;
      background: var(--blue);
      box-shadow: 7px 7px 0 var(--ink);
      font-size: clamp(16px, 4.6vmin, 18px);
      font-weight: 1000;
      text-transform: uppercase;
      transform-origin: 58% 62%;
      transform: translate3d(0, 0, 0);
      transition: none;
      will-change: transform;
    }

    .primary-button:not(:disabled):hover {
      transform: translate3d(-2px, -2px, 0);
    }

    .primary-button.is-pressed:not(:disabled),
    .primary-button:not(:disabled):active {
      transform: translate3d(2px, 2px, 0) scale(0.94);
      filter: saturate(1.08);
    }

    .primary-button.is-releasing:not(:disabled) {
      transition: transform 115ms cubic-bezier(0.17, 0.84, 0.44, 1), filter 115ms ease-out;
    }

    .secondary-button {
      min-height: 48px;
      border: 4px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: var(--cream);
      box-shadow: 5px 5px 0 var(--ink);
      font-weight: 1000;
      text-transform: uppercase;
      transform-origin: 58% 62%;
      transform: translate3d(0, 0, 0);
      transition: none;
      will-change: transform;
    }

    .secondary-button.is-pressed:not(:disabled),
    .secondary-button:not(:disabled):active {
      transform: translate3d(2px, 2px, 0) scale(0.95);
      filter: saturate(1.08);
    }

    .secondary-button.is-releasing:not(:disabled) {
      transition: transform 115ms cubic-bezier(0.17, 0.84, 0.44, 1), filter 115ms ease-out;
    }

    .controller-lobby {
      display: grid;
      gap: clamp(8px, 2.2vh, 18px);
      justify-items: center;
      text-align: center;
    }

    .controller-avatar {
      --avatar-color: var(--cyan);
      width: clamp(72px, 22vmin, 112px);
      height: clamp(72px, 22vmin, 112px);
      display: grid;
      place-items: center;
      border: 5px solid var(--ink);
      background: var(--avatar-color);
      box-shadow: 9px 9px 0 rgba(23, 19, 31, 0.55);
      color: #fff;
      font-size: clamp(32px, 10vmin, 48px);
      font-weight: 1000;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
    }

    .controller-player-name {
      margin: 0;
      font-size: clamp(30px, 11vmin, 58px);
      line-height: 0.9;
      font-weight: 1000;
      overflow-wrap: anywhere;
    }

    .controller-meta {
      min-height: clamp(22px, 5vh, 36px);
      color: #5e5475;
      font-size: clamp(14px, 4.2vmin, 18px);
      font-weight: 1000;
    }

    .lab {
      min-height: 100vh;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(23, 19, 31, 0.92), rgba(91, 27, 189, 0.86)),
        radial-gradient(circle at top left, rgba(255, 225, 86, 0.6), transparent 24rem);
    }

    .lab-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      color: #fff;
    }

    .lab-header h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 54px);
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 4px 4px 0 var(--ink);
    }

    .lab-header a {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 0 14px;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 5px 5px 0 var(--ink);
      text-decoration: none;
      font-weight: 1000;
      white-space: nowrap;
    }

    .lab-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.65fr);
      gap: 16px;
      height: calc(100vh - 96px);
      min-height: 620px;
    }

    .lab-frame {
      width: 100%;
      height: 100%;
      border: 5px solid var(--ink);
      border-radius: 24px;
      background: #fff;
      box-shadow: 12px 12px 0 rgba(23, 19, 31, 0.65);
    }

    @media (max-width: 760px) {
      .stage {
        gap: 16px;
        padding: 16px;
      }

      .stage-main {
        padding-top: 12px;
      }

      .stage-status,
      .join-prompt {
        width: 100%;
        border-radius: 18px;
        text-align: center;
      }

      .player-lobby {
        justify-content: center;
      }

      .lab-grid {
        grid-template-columns: 1fr;
        height: auto;
      }

      .lab-frame {
        min-height: 620px;
      }
    }

    @media (max-height: 620px) {
      .controller-panel {
        border-width: 4px;
        border-radius: 22px;
        box-shadow: 10px 10px 0 var(--ink);
      }

      .controller-avatar {
        border-width: 4px;
        box-shadow: 6px 6px 0 rgba(23, 19, 31, 0.55);
      }

      .primary-button {
        border-width: 4px;
        box-shadow: 5px 5px 0 var(--ink);
      }
    }

    @media (max-height: 380px) {
      .controller {
        padding: 8px;
      }

      .controller-panel {
        gap: 8px;
        max-height: calc(100dvh - 16px);
        padding: 12px;
        border-radius: 18px;
        box-shadow: 7px 7px 0 var(--ink);
      }

      .controller-lobby {
        gap: 6px;
      }

      .controller-avatar {
        width: clamp(52px, 18vmin, 70px);
        height: clamp(52px, 18vmin, 70px);
        font-size: clamp(24px, 8vmin, 32px);
        box-shadow: 4px 4px 0 rgba(23, 19, 31, 0.55);
      }

      .controller-player-name {
        font-size: clamp(24px, 9vmin, 36px);
      }

      .controller-meta {
        min-height: 18px;
        font-size: clamp(12px, 4vmin, 14px);
      }

      .primary-button {
        min-height: 40px;
        padding: 0 16px;
        font-size: 14px;
        box-shadow: 4px 4px 0 var(--ink);
      }
    }
  </style>
</head>
<body>
  <section class="screen stage hidden" id="stageScreen" aria-label="Flip 7 Party stage">
    <div class="start-popup hidden" id="startPopup">Starting Game</div>
    <main class="stage-main">
      <h1 class="stage-title">Flip 7 Party</h1>
      <section class="stage-code-panel" aria-label="Stage code">
        <div class="stage-code-label">Stage Code</div>
        <div class="stage-code" id="stageCodeText">----</div>
      </section>
      <div class="stage-status hidden" id="waitingStatus"></div>
    </main>
    <footer class="stage-footer">
      <div class="join-prompt" id="joinPrompt">Join the Lobby at bit.ly/popcontroller</div>
      <div class="player-lobby" id="playerLobby" aria-label="Joined players"></div>
    </footer>
  </section>

  <section class="screen controller hidden" id="controllerScreen" aria-label="Flip 7 Party controller">
    <div class="controller-panel">
      <div id="joinState">
        <h1>Join Lobby</h1>
        <form class="join-form" id="joinForm">
          <label class="field-label">
            Stage Code
            <input class="text-input stage-code-input" id="stageCodeInput" maxlength="6" autocomplete="off" placeholder="ABCD">
          </label>
          <label class="field-label">
            Player Name
            <input class="text-input" id="playerNameInput" maxlength="24" autocomplete="name" placeholder="Your name">
          </label>
          <button class="primary-button" id="joinButton" type="submit" disabled>Join</button>
        </form>
      </div>

      <div class="controller-lobby hidden" id="controllerLobbyState" data-controller-view="lobby">
        <div class="controller-avatar" id="controllerAvatar"><span id="controllerAvatarInitial">?</span></div>
        <h1 class="controller-player-name" id="controllerPlayerName">Player</h1>
        <div class="controller-meta" id="controllerMeta">Waiting in lobby</div>
        <button class="primary-button hidden" id="startGameButton" type="button" data-controller-option data-option-id="lobby.startGame">Start Game</button>
      </div>
    </div>
  </section>

  <section class="screen lab hidden" id="labScreen" aria-label="Split screen test lab">
    <div class="lab-header">
      <h1>Flip 7 Party Lab</h1>
      <a id="stageLinkFromLab" href="/stage" target="_blank" rel="noreferrer">Open real stage</a>
    </div>
    <div class="lab-grid">
      <iframe class="lab-frame" id="stageFrame" title="Stage view"></iframe>
      <iframe class="lab-frame" id="controllerFrame" title="Controller view"></iframe>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pathRoles = {
      "/stage": "stage",
      "/s": "stage",
      "/controller": "controller",
      "/c": "controller",
      "/lab": "lab",
      "/l": "lab"
    };
    const requestedRole = params.get("role");
    const requestedPathRole = pathRoles[window.location.pathname.toLowerCase()];
    const role = requestedRole === "controller" || requestedRole === "lab" ? requestedRole : requestedPathRole || "stage";
    const origin = window.location.origin;
    const canUseServer = window.location.protocol === "http:" || window.location.protocol === "https:";
    const stageScreen = document.querySelector("#stageScreen");
    const controllerScreen = document.querySelector("#controllerScreen");
    const labScreen = document.querySelector("#labScreen");
    const stageCodeText = document.querySelector("#stageCodeText");
    const playerLobby = document.querySelector("#playerLobby");
    const joinPrompt = document.querySelector("#joinPrompt");
    const waitingStatus = document.querySelector("#waitingStatus");
    const startPopup = document.querySelector("#startPopup");
    const joinState = document.querySelector("#joinState");
    const controllerLobbyState = document.querySelector("#controllerLobbyState");
    const joinForm = document.querySelector("#joinForm");
    const stageCodeInput = document.querySelector("#stageCodeInput");
    const playerNameInput = document.querySelector("#playerNameInput");
    const joinButton = document.querySelector("#joinButton");
    const controllerPlayerName = document.querySelector("#controllerPlayerName");
    const controllerAvatar = document.querySelector("#controllerAvatar");
    const controllerAvatarInitial = document.querySelector("#controllerAvatarInitial");
    const controllerMeta = document.querySelector("#controllerMeta");
    const startGameButton = document.querySelector("#startGameButton");
    let controllerState = null;
    let heartbeatTimer = null;
    let lobbyPollTimer = null;

    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function normalizeStageCode(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    }

    function generateStageCode() {
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let index = 0; index < 4; index += 1) {
        code += alphabet[randomBetween(0, alphabet.length - 1)];
      }
      return code;
    }

    function getStageCodeFromUrl() {
      return normalizeStageCode(params.get("stage") || params.get("code"));
    }

    function getPlayerNameFromUrl() {
      return String(params.get("name") || params.get("playerName") || "").trim().slice(0, 24);
    }

    function shouldAutoJoin() {
      return params.get("autojoin") === "1" || params.get("join") === "1";
    }

    function syncAppHeight() {
      document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
    }

    function shouldAllowControllerTouch(target) {
      return Boolean(target?.closest?.("input, textarea, select"));
    }

    function lockControllerViewport() {
      syncAppHeight();
      document.documentElement.classList.add("controller-locked");
      document.body.classList.add("controller-locked");
      window.scrollTo(0, 0);
      window.addEventListener("resize", syncAppHeight);
      window.addEventListener("orientationchange", syncAppHeight);
      window.addEventListener("wheel", (event) => event.preventDefault(), { passive: false });
      window.addEventListener("touchmove", (event) => {
        if (!shouldAllowControllerTouch(event.target)) event.preventDefault();
      }, { passive: false });
    }

    function bindControllerButtonPressStates() {
      const pressableButtons = controllerScreen.querySelectorAll("button");
      const pressButton = (button) => {
        if (button.disabled) return;
        window.clearTimeout(button.releaseTimerId);
        button.classList.remove("is-releasing");
        button.classList.add("is-pressed");
      };
      const releaseButton = (button) => {
        if (!button.classList.contains("is-pressed")) return;
        button.classList.add("is-releasing");
        button.classList.remove("is-pressed");
        window.clearTimeout(button.releaseTimerId);
        button.releaseTimerId = window.setTimeout(() => {
          button.classList.remove("is-releasing");
        }, 140);
      };
      const releaseButtons = () => {
        for (const button of pressableButtons) releaseButton(button);
      };
      for (const button of pressableButtons) {
        button.addEventListener("pointerdown", () => pressButton(button));
        button.addEventListener("pointerup", () => releaseButton(button));
        button.addEventListener("pointercancel", () => releaseButton(button));
        button.addEventListener("pointerleave", () => releaseButton(button));
        button.addEventListener("blur", () => releaseButton(button));
      }
      window.addEventListener("pointerup", releaseButtons);
      window.addEventListener("pointercancel", releaseButtons);
    }

    function getOrCreateStageCode() {
      const existing = getStageCodeFromUrl();
      if (existing) return existing;
      const next = generateStageCode();
      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set("stage", next);
      window.history.replaceState({}, "", `${window.location.pathname}?${nextParams.toString()}`);
      return next;
    }

    function getControllerPlayerId() {
      const explicit = params.get("player");
      if (explicit) return explicit;
      const existing = sessionStorage.getItem("flip7PlayerId");
      if (existing) return existing;
      const next = `p-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      sessionStorage.setItem("flip7PlayerId", next);
      return next;
    }

    function avatarInitial(name) {
      return String(name || "?").trim().charAt(0).toUpperCase() || "?";
    }

    function avatarClass(shape) {
      return `shape-${shape || "circle"}`;
    }

    async function postJson(path, payload) {
      if (!canUseServer) throw new Error("Open this app through the server first.");
      const response = await fetch(`${origin}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok === false) {
        const error = new Error(result.error || "Something went wrong.");
        error.code = result.errorCode || "";
        error.status = response.status;
        throw error;
      }
      return result;
    }

    async function getJson(path) {
      const response = await fetch(`${origin}${path}`, { cache: "no-store" });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok === false) {
        throw new Error(result.error || "Something went wrong.");
      }
      return result;
    }

    function renderStageLobby(lobby) {
      const players = lobby.players || [];
      playerLobby.replaceChildren();
      for (const player of players) {
        const tile = document.createElement("article");
        tile.className = "player-tile";
        tile.innerHTML = `
          <div class="player-avatar ${avatarClass(player.avatar?.shape)}" style="--avatar-color:${player.avatar?.color || "#22d3ee"}"><span>${avatarInitial(player.name)}</span></div>
          <div class="player-name"></div>
          ${player.isVip ? '<div class="vip-badge">VIP</div>' : ""}
        `;
        tile.querySelector(".player-name").textContent = player.name;
        playerLobby.appendChild(tile);
      }

      const vip = players.find((player) => player.isVip);
      joinPrompt.classList.toggle("hidden", players.length > 0);
      waitingStatus.classList.toggle("hidden", players.length === 0);
      waitingStatus.textContent = vip ? `Waiting for ${vip.name} to start the game` : "";
    }

    function showStartPopup() {
      if (!startPopup.classList.contains("hidden")) return;
      startPopup.classList.remove("hidden");
      window.clearTimeout(showStartPopup.timeoutId);
      showStartPopup.timeoutId = window.setTimeout(() => {
        startPopup.classList.add("hidden");
      }, 2200);
    }

    async function pollLobby(stageCode) {
      try {
        const result = await getJson(`/api/stage/${stageCode}/lobby`);
        renderStageLobby(result.lobby);
      } catch (error) {
        waitingStatus.classList.remove("hidden");
        waitingStatus.textContent = "Reconnecting to lobby";
      }
    }

    function subscribeToStage(stageCode) {
      if (!canUseServer) {
        waitingStatus.classList.remove("hidden");
        waitingStatus.textContent = "Open through the server to host a lobby";
        return;
      }

      if (!("EventSource" in window)) {
        pollLobby(stageCode);
        lobbyPollTimer = window.setInterval(() => pollLobby(stageCode), 1000);
        return;
      }

      const stream = new EventSource(`${origin}/api/stage/${stageCode}/events`);
      stream.addEventListener("lobby", (event) => {
        renderStageLobby(JSON.parse(event.data));
      });
      stream.addEventListener("start", () => {
        showStartPopup();
      });
      stream.addEventListener("error", () => {
        waitingStatus.classList.remove("hidden");
        waitingStatus.textContent = "Reconnecting to lobby";
      });
    }

    function setupStage() {
      stageScreen.classList.remove("hidden");
      const stageCode = getOrCreateStageCode();
      stageCodeText.textContent = stageCode;
      subscribeToStage(stageCode);
    }

    function updateJoinButton() {
      const hasStage = normalizeStageCode(stageCodeInput.value).length > 0;
      const hasName = playerNameInput.value.trim().length > 0;
      joinButton.disabled = !(hasStage && hasName);
    }

    async function joinController(stageCode, playerName) {
      const playerId = getControllerPlayerId();
      joinButton.disabled = true;
      const result = await postJson("/api/join", { stageCode, playerName, playerId });
      enterControllerLobby(stageCode, result.player.id, result.lobby, result.player);
      return result;
    }

    function setControllerAvatar(player) {
      controllerAvatar.className = `controller-avatar ${avatarClass(player.avatar?.shape)}`;
      controllerAvatar.style.setProperty("--avatar-color", player.avatar?.color || "#22d3ee");
      controllerAvatarInitial.textContent = avatarInitial(player.name);
    }

    function renderControllerLobby(lobby) {
      if (!controllerState) return;
      const me = (lobby.players || []).find((player) => player.id === controllerState.playerId);
      if (!me) {
        controllerState.startToken = "";
        controllerMeta.textContent = "Reconnecting to lobby";
        startGameButton.classList.add("hidden");
        return;
      }
      controllerState.player = me;
      controllerState.startToken = me.isVip ? lobby.startToken : "";
      controllerPlayerName.textContent = me.name;
      setControllerAvatar(me);
      controllerMeta.textContent = me.isVip ? "VIP Player" : "Waiting for the VIP";
      startGameButton.classList.toggle("hidden", !me.isVip);
      startGameButton.disabled = !me.isVip;
    }

    async function heartbeat() {
      if (!controllerState) return;
      try {
        const result = await postJson("/api/heartbeat", {
          stageCode: controllerState.stageCode,
          playerId: controllerState.playerId
        });
        renderControllerLobby(result.lobby);
      } catch (error) {
        controllerMeta.textContent = "Reconnecting to lobby";
      }
    }

    function enterControllerLobby(stageCode, playerId, lobby, player) {
      controllerState = { stageCode, playerId, player };
      sessionStorage.setItem("flip7PlayerId", playerId);
      sessionStorage.setItem("flip7PlayerName", player.name);
      sessionStorage.setItem("flip7StageCode", stageCode);
      localStorage.setItem("flip7StageCode", stageCode);
      joinState.classList.add("hidden");
      controllerLobbyState.classList.remove("hidden");
      renderControllerLobby(lobby);
      window.clearInterval(heartbeatTimer);
      heartbeatTimer = window.setInterval(heartbeat, 3000);
    }

    async function leaveLobby() {
      if (!controllerState) return;
      const leaving = controllerState;
      controllerState = null;
      window.clearInterval(heartbeatTimer);
      await postJson("/api/leave", {
        stageCode: leaving.stageCode,
        playerId: leaving.playerId
      }).catch(() => {});
      controllerLobbyState.classList.add("hidden");
      joinState.classList.remove("hidden");
      updateJoinButton();
    }

    function setupController() {
      lockControllerViewport();
      bindControllerButtonPressStates();
      controllerScreen.classList.remove("hidden");
      stageCodeInput.value = getStageCodeFromUrl() || normalizeStageCode(sessionStorage.getItem("flip7StageCode") || localStorage.getItem("flip7StageCode"));
      playerNameInput.value = getPlayerNameFromUrl() || sessionStorage.getItem("flip7PlayerName") || "";
      updateJoinButton();

      stageCodeInput.addEventListener("input", () => {
        const cursorPosition = stageCodeInput.selectionStart;
        stageCodeInput.value = normalizeStageCode(stageCodeInput.value);
        stageCodeInput.setSelectionRange(cursorPosition, cursorPosition);
        updateJoinButton();
      });
      playerNameInput.addEventListener("input", () => {
        if (!controllerState && playerNameInput.value.trim() !== sessionStorage.getItem("flip7PlayerName")) {
          sessionStorage.removeItem("flip7PlayerId");
        }
        updateJoinButton();
      });

      joinForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const stageCode = normalizeStageCode(stageCodeInput.value);
        const playerName = playerNameInput.value.trim();
        try {
          await joinController(stageCode, playerName);
        } catch (error) {
          joinButton.disabled = false;
          joinButton.textContent = error.message;
          window.setTimeout(() => {
            joinButton.textContent = "Join";
            updateJoinButton();
          }, 1800);
        }
      });

      if (shouldAutoJoin() && normalizeStageCode(stageCodeInput.value) && playerNameInput.value.trim()) {
        joinButton.textContent = "Joining";
        joinController(normalizeStageCode(stageCodeInput.value), playerNameInput.value.trim()).catch((error) => {
          joinButton.disabled = false;
          joinButton.textContent = error.message;
          window.setTimeout(() => {
            joinButton.textContent = "Join";
            updateJoinButton();
          }, 1800);
        });
      }

      startGameButton.addEventListener("click", async (event) => {
        if (!event.isTrusted) return;
        if (!controllerState) return;
        if (!controllerState.player?.isVip) return;
        try {
          await postJson("/api/start", {
            stageCode: controllerState.stageCode,
            playerId: controllerState.playerId,
            startToken: controllerState.startToken
          });
          controllerMeta.textContent = "Starting Game";
        } catch (error) {
          controllerMeta.textContent = error.message;
        }
      });

      window.addEventListener("pagehide", () => {
        if (!controllerState || !navigator.sendBeacon) return;
        const body = JSON.stringify({
          stageCode: controllerState.stageCode,
          playerId: controllerState.playerId
        });
        navigator.sendBeacon(`${origin}/api/leave`, new Blob([body], { type: "application/json" }));
      });
    }

    function setupLab() {
      labScreen.classList.remove("hidden");
      const stageCode = getStageCodeFromUrl() || generateStageCode();
      document.querySelector("#stageLinkFromLab").href = `${origin}/stage?stage=${stageCode}`;
      document.querySelector("#stageFrame").src = `${origin}/stage?stage=${stageCode}`;
      document.querySelector("#controllerFrame").src = `${origin}/controller?stage=${stageCode}`;
    }

    if (role === "lab") {
      setupLab();
    } else if (role === "controller") {
      setupController();
    } else {
      setupStage();
    }
  </script>
</body>
</html>
