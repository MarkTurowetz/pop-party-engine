name: publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact version already committed in both public package manifests
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to authorize the irreversible npm release
        required: true
        type: string
      promote_production:
        description: Also opt the reference Production deployment into this release
        required: true
        default: false
        type: boolean

concurrency:
  group: pop-party-publication
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: >-
          timeout --signal=TERM --kill-after=15s 120s npx playwright install --with-deps chromium
          || (echo "Playwright system dependency installation stalled; using the GitHub runner dependencies."
          && npx playwright install chromium)
      - run: npm run release:check -- "${{ inputs.release_version }}"
      - run: npm run split:audit-history
      - run: npm run check

      - name: Publish or verify engine with npm provenance
        run: node scripts/publish-public-package.js --package ./packages/engine

      - name: Publish or verify game generator with npm provenance
        run: node scripts/publish-public-package.js --package ./packages/create-game

      - name: Create or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if gh release view "engine-v${RELEASE_VERSION}" >/dev/null 2>&1; then
            RELEASE_TARGET="$(gh release view "engine-v${RELEASE_VERSION}" --json targetCommitish --jq .targetCommitish)"
            if [ "${RELEASE_TARGET}" != "${GITHUB_SHA}" ]; then
              echo "GitHub release engine-v${RELEASE_VERSION} targets ${RELEASE_TARGET}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "GitHub release engine-v${RELEASE_VERSION} already targets this commit."
          else
            gh release create "engine-v${RELEASE_VERSION}" --target "${GITHUB_SHA}" --generate-notes
          fi

  deploy-reference:
    needs: publish
    if: inputs.promote_production == true
    runs-on: ubuntu-latest
    env:
      REFERENCE_PRODUCTION_URL: https://pop-party.onrender.com
      RELEASE_OPERATION_KEY: engine-${{ inputs.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Resolve the exact rendered application build
        id: build
        run: >-
          node -e 'const fs=require("fs");
          process.argv.push("--next");
          const info=require("./build-version").buildInfo();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `app_version=${info.version}\n`)'

      - name: Activate matching reference release coordinates
        id: activate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/reference-release-activation.json
        run: >-
          node scripts/coordinate-reference-release.js activate
          --engine-version "${{ inputs.release_version }}"
          --operation-key "${RELEASE_OPERATION_KEY}"
          --state-file "${RELEASE_STATE_FILE}"

      - name: Trigger Render for the exact released commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: node scripts/trigger-render-deploy.js

      - name: Verify the coordinated production release
        id: verify
        run: >-
          node scripts/verify-production-release.js
          --base-url "${REFERENCE_PRODUCTION_URL}"
          --engine-version "${{ inputs.release_version }}"
          --release-revision "${{ steps.activate.outputs.release_revision }}"
          --app-version "${{ steps.build.outputs.app_version }}"

      - name: Restore prior release coordinates after a failed deployment
        if: ${{ failure() && steps.activate.outputs.changed == 'true' && steps.verify.outcome != 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/reference-release-activation.json
        run: >-
          node scripts/coordinate-reference-release.js rollback
          --operation-key "${RELEASE_OPERATION_KEY}"
          --state-file "${RELEASE_STATE_FILE}"

  deploy-preview:
    needs: [publish, deploy-reference]
    if: >-
      always()
      && needs.publish.result == 'success'
      && (inputs.promote_production == false || needs.deploy-reference.result == 'success')
    runs-on: ubuntu-latest
    env:
      REFERENCE_PREVIEW_URL: https://pop-party-preview.onrender.com
      PREVIEW_OPERATION_KEY: engine-preview-${{ inputs.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Activate isolated Preview release coordinates
        id: activate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/reference-preview-release-activation.json
        run: >-
          node scripts/coordinate-reference-release.js activate
          --engine-version "${{ inputs.release_version }}"
          --operation-key "${PREVIEW_OPERATION_KEY}"
          --release-ref "heads/game-releases-preview"
          --source-release-ref "heads/game-releases"
          --state-file "${RELEASE_STATE_FILE}"

      - name: Deploy and verify the exact release in Preview
        env:
          RENDER_PREVIEW_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK_URL }}
        run: >-
          node scripts/deploy-reference-preview.js
          --base-url "${REFERENCE_PREVIEW_URL}"
          --release-authority-url "${REFERENCE_PREVIEW_URL}"
          --engine-version "${{ inputs.release_version }}"
          --release-revision "${{ steps.activate.outputs.release_revision }}"
          --commit "${GITHUB_SHA}"

      - name: Restore prior Preview coordinates after a failed deployment
        if: ${{ failure() && steps.activate.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/reference-preview-release-activation.json
        run: >-
          node scripts/coordinate-reference-release.js rollback
          --operation-key "${PREVIEW_OPERATION_KEY}"
          --release-ref "heads/game-releases-preview"
          --state-file "${RELEASE_STATE_FILE}"
