name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout authored game data
        uses: actions/checkout@v4
        with:
          ref: game-data
          path: .authored-game-data
          sparse-checkout: art-manifest.json

      - name: Install authored art manifest
        run: cp .authored-game-data/art-manifest.json art/art-manifest.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: npm run check
