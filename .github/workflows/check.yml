name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: >-
          timeout --signal=TERM --kill-after=15s 120s npx playwright install --with-deps chromium
          || (echo "Playwright system dependency installation stalled; using the GitHub runner dependencies."
          && npx playwright install chromium)

      - name: Run checks
        run: npm run check
