services:
  - type: web
    name: party-game-template
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --no-audit --no-fund && npm run build-info:next
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PARTY_GAME_USE_VITE_ENTRIES
        value: 1
      - key: PARTY_GAME_CONTENT_STORE
        value: github
      - key: PARTY_GAME_REMOTE_AUTHORING
        value: enabled
      - key: PARTY_GAME_AUTHORING_SCOPE
        value: default
      - key: PARTY_GAME_CONTENT_GITHUB_REPO
        value: MarkTurowetz/pop-party-engine
      - key: PARTY_GAME_CONTENT_BASE_REF
        value: heads/main
      - key: PARTY_GAME_CONTENT_REF
        value: heads/game-data-v2
      - key: PARTY_GAME_CONTENT_DRAFT_REF_PREFIX
        value: heads/game-drafts/
      - key: PARTY_GAME_RELEASE_REF
        value: heads/game-releases
      - key: PARTY_GAME_CONTENT_GITHUB_APP_ID
        sync: false
      - key: PARTY_GAME_CONTENT_GITHUB_INSTALLATION_ID
        sync: false
      - key: PARTY_GAME_CONTENT_GITHUB_PRIVATE_KEY
        sync: false
      - key: PARTY_GAME_ADMIN_AUTH_MODE
        value: github
      - key: PARTY_GAME_GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: PARTY_GAME_GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: PARTY_GAME_GITHUB_OAUTH_CALLBACK_URL
        value: https://pop-party.onrender.com/auth/github/callback
      - key: PARTY_GAME_ADMIN_GITHUB_USER_ID
        sync: false
      - key: PARTY_GAME_RUNTIME_CAPABILITIES
        value: required
