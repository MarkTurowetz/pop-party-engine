services:
  - type: web
    name: party-game-template
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PARTY_GAME_USE_VITE_ENTRIES
        value: 1
      - key: GAME_FLOW_STORAGE
        value: github
      - key: GAME_FLOW_GITHUB_REPO
        value: MarkTurowetz/pop-party
      - key: GAME_FLOW_GITHUB_BRANCH
        value: game-data
      - key: GAME_FLOW_GITHUB_BASE_BRANCH
        value: main
      - key: GAME_FLOW_GITHUB_PATH
        value: game-flow.json
      - key: GAME_CONSTANTS_GITHUB_PATH
        value: game-constants.json
      - key: STAGE_LAYOUTS_GITHUB_PATH
        value: stage-layouts.json
      - key: CONTROLLER_LAYOUTS_GITHUB_PATH
        value: controller-layouts.json
      - key: HOST_AUDIOS_GITHUB_PATH
        value: host-audios.json
      - key: ART_MANIFEST_GITHUB_PATH
        value: art-manifest.json
      - key: GAME_FLOW_GITHUB_TOKEN
        sync: false
