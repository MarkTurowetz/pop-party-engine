<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow node canvas world regression</title>
    <style>
      :root {
        --ink: #17131f;
        --paper: #fffdf4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #root {
        padding: 12px;
      }
      .flow-node-canvas-bar {
        height: 48px;
      }
      .flow-node-stage-wrap {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
      }
      .flow-node-stage {
        position: relative;
        background: #2b145f;
      }
      .flow-node {
        border: 3px solid var(--ink);
        border-radius: 10px;
        padding: 12px;
        background: var(--paper);
      }
      .flow-node-port {
        width: 24px;
        height: 24px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #22d3ee;
      }
      .flow-node-port-label {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/checks/fixtures/flow-node-canvas-world.tsx"></script>
  </body>
